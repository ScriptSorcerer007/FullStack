<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color: #f87205;
            --secondary-color: rgb(10, 10, 10);
            --text-color: #f8e003;
        }
        div{
            --primary-color: white;
            --text-color: blue
        }
        p{
            background-color: var(--primary-color);
            color: var(--secondary-color);
            font-size: 20px;

        }
        .container{
            --primary-color: green;
        }
        .container1{
            --primary-color: rgb(7, 23, 247);
            height: 100px;
            width: 100px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <p>My Name is Prakhar</p>
    <p>My Name is Prakhar</p>
    <p>My Name is Prakhar</p>
    <div class="Prakhar">
            <p>My Name is Prakhar</p>
            <div class="container1">
                <p>My Name is Prakhar</p>
            </div>
            <p>My Name is Prakhar</p>
        </div>
    <div class="container">
        <p>My Name is Prakhar</p>
        <p>My Name is Prakhar</p>
        <p>My Name is Prakhar</p>
    </div>
</body>
</html>
