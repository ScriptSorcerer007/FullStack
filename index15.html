<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        .container {
            margin: 100px;
            padding: 100px;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: 10px 10px 10px 10px 10px;
            height: 100vh;
            gap: 10%;
            background-color: white;
        }
        .container>div {
            outline: 1px solid black;
        }
        </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
