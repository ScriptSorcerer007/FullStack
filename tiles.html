<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chessboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;

            background-color: white;
        }

        .container {
            width: 500px;   /*can also write flex-basis*/
            height: 500px;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .box {
            width: 62.5px;
            height: 62.5px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ROW 1 */

        .box:nth-child(odd) {
            background-color: black;
            color: yellow;
        }

        .box:nth-child(even) {
            background-color: white;
        }


        /* ROW 2 */

        .box:nth-child(n+9):nth-child(-n+16) {
            background-color: white;
            color: black;
        }

        .box:nth-child(n+10):nth-child(-n+16) {
            background-color: black;
            color: yellow;
        }


        /* ROW 3 */

        .box:nth-child(n+17):nth-child(-n+24) {
            background-color: black;
            color: yellow;
        }

        .box:nth-child(n+18):nth-child(-n+24) {
            background-color: white;
            color: black;
        }


        /* ROW 4 */

        .box:nth-child(n+25):nth-child(-n+32) {
            background-color: white;
            color: black;
        }

        .box:nth-child(n+26):nth-child(-n+32) {
            background-color: black;
            color: yellow;
        }


        /* ROW 5 */

        .box:nth-child(n+33):nth-child(-n+40) {
            background-color: black;
            color: yellow;
        }

        .box:nth-child(n+34):nth-child(-n+40) {
            background-color: white;
            color: black;
        }


        /* ROW 6 */

        .box:nth-child(n+41):nth-child(-n+48) {
            background-color: white;
            color: black;
        }

        .box:nth-child(n+42):nth-child(-n+48) {
            background-color: black;
            color: yellow;
        }


        /* ROW 7 */

        .box:nth-child(n+49):nth-child(-n+56) {
            background-color: black;
            color: yellow;
        }

        .box:nth-child(n+50):nth-child(-n+56) {
            background-color: white;
            color: black;
        }


        /* ROW 8 */

        .box:nth-child(n+57):nth-child(-n+64) {
            background-color: white;
            color: black;
        }

        .box:nth-child(n+58):nth-child(-n+64) {
            background-color: black;
            color: yellow;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box">1</div>
