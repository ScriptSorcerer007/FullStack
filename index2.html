<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Name Form</title>
    <style>
        .container{
            height: 100px;
            outline: 10px solid white;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }
        .container>div{
            background-color:solid blue;
            color: yellow;
            flex-basis: 100px;
            width: 100px;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1{
            background-color: black;
            flex-grow: 1 0 150px;
        }
        #box2{
            background-color: black;
            flex-grow: 2 0 150px;
        }
        #box3{
            background-color: black;
            flex-grow: 1 0 150px;
        }
        #box4{
            background-color: black;
            flex-grow: 1 0 150px;
        }
        #box5{
            background-color: black;
            flex-grow: 2 0 150px;
        }
        #box6{
            background-color: black;
            flex-grow: 1 0 150px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">prakhar</div>
        <div id="box2">jain</div>
        <div id="box3">GLA</div>
        <div id="box4">Mathura</div>
        <div id="box5">Uttar Pradesh</div>
        <div id="box6">India</div>
    </div>
</body>
</html>
