<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
    }
    .login-box {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 9px;
      margin-top: 15px;
      background: blue;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <label>Username</label>
    <input type="text" placeholder="Enter username">
    <label>Password</label>
    <input type="password" placeholder="Enter password">
    <button>Login</button>
  </div>
</body></html>
