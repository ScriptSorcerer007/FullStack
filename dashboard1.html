<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr 60px;
        }
        .header {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 1 / 3;
        }
        .header h1 {
            margin: 0;
        }
        .sidebar {
            background-color: #eeeeee;
            padding: 20px;
            grid-row: 2 / 3;
        }

        .sidebar h2 {
            margin-top: 0;
        }
        .sidebar p {
            padding: 10px;
            margin: 5px 0;
            background-color: white;
            border: 1px solid black;
        }
        .main {
            padding: 30px;

            background-color: #f5f5f5;

            /* Cards inside main content */
            display: grid;

            grid-template-columns: repeat(3, minmax(150px, 1fr));

            grid-template-rows: repeat(2, 150px);

            gap: 20px;

            overflow-x: auto;
        }

        .card {
            background-color: yellow;
            outline: 3px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        .footer {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 1 / 3;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header">

            <h1>My Dashboard</h1>

        </header>
        <aside class="sidebar">
            <h2>Menu</h2>
            <p>Home</p>
            <p>Profile</p>
            <p>Analytics</p>
            <p>Settings</p>
            <p>Logout</p>
        </aside>
        <main class="main">
            <div class="card">
                Users
            </div>
            <div class="card">
                Sales
            </div>
            <div class="card">
                Orders
            </div>
            <div class="card">
                Revenue
            </div>
            <div class="card">
                Products
            </div>
            <div class="card">
                Reports
            </div>
        </main>
        <footer class="footer">

            <p>© 2026 My Dashboard</p>

        </footer>


    </div>

</body>

</html>
