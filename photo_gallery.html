<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Photo Gallery</title>
<h2>My Photo Gallery</h2>
<margin-top: 20px; margin-bottom: 20px;>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}
.gallery{
    width:480px;
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}
.box{
    width:150px;
    height:150px;
    background:lightgray;
    border:2px solid #555;
}
</style>
</head>
<body>
<div class="gallery">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>
</body>
</html>
